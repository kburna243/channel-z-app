name: "📱 Bug Report: Android Full (Mobile / Tablet / Chat)"
description: Report a bug or crash in the Android Full Edition (with Chat & Userlist)
title: "[Bug - Android Full]: "
labels: ["bug", "android-full"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an issue with the **Android Full Edition** (`com.aistudio.grindhouse420.kxbz.full`).
  - type: input
    id: app_version
    attributes:
      label: App Version
      description: What version is shown in Settings > Info (e.g. v1.6.4 / Build 32)?
      placeholder: "v1.6.4"
    validations:
      required: true
  - type: dropdown
    id: device_type
    attributes:
      label: Device Type
      options:
        - "Android Smartphone"
        - "Android Tablet"
        - "PC Handheld (Steam Deck, ROG Ally, etc.)"
        - "Android Emulator"
        - "Other"
    validations:
      required: true
  - type: input
    id: os_version
    attributes:
      label: Device Model & Android Version
      description: e.g. Google Pixel 8 (Android 14) / Samsung Galaxy S23 (Android 14)
      placeholder: "Samsung Galaxy Tab S8 - Android 14"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what went wrong.
      placeholder: "When opening the full screen chat while playing a YouTube stream, ..."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce the problem?
      placeholder: |
        1. Open the app
        2. Start a stream
        3. Tap on the Chat icon
        4. See error
    validations:
      required: true
  - type: textarea
    id: logs_or_media
    attributes:
      label: Logs / Media (Optional)
      description: Paste any Logcat logs, stacktraces, or drag & drop screenshots/videos.
